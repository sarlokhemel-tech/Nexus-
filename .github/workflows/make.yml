name: Build Nexus APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Use Node 24 to avoid deprecation warnings in hosted runners
          node-version: '24'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools and platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Show repository root contents and find Cordova project
        run: |
          pwd
          echo "Listing repo root files"
          ls -la
          echo "Searching for Cordova project files (config.xml or cordova in package.json)"
          find . -maxdepth 5 -type f \( -name config.xml -o -name package.json \) -print || true

      - name: Detect Cordova project directory
        id: detect
        run: |
          set -euo pipefail
          CORDOVA_DIR=""

          # Prefer directory that contains config.xml
          cfg=$(find . -type f -name config.xml -print -quit || true)
          if [ -n "$cfg" ]; then
            CORDOVA_DIR=$(dirname "$cfg")
          else
            # Otherwise look for a package.json mentioning cordova
            while IFS= read -r pkg; do
              if grep -q "cordova" "$pkg" 2>/dev/null || grep -q "cordova" "$(dirname "$pkg")/config.xml" 2>/dev/null; then
                CORDOVA_DIR=$(dirname "$pkg")
                break
              fi
            done < <(find . -maxdepth 5 -name package.json -print || true)
          fi

          if [ -z "$CORDOVA_DIR" ]; then
            echo "No Cordova project detected in the repository. Make sure config.xml or a Cordova package.json exists." >&2
            exit 1
          fi

          # Normalize path and export for subsequent steps
          CORDOVA_DIR=$(echo "$CORDOVA_DIR" | sed 's|^\./||')
          echo "Detected Cordova project directory: $CORDOVA_DIR"
          echo "CORDOVA_DIR=$CORDOVA_DIR" >> $GITHUB_ENV
          echo "cordova_dir=$CORDOVA_DIR" >> $GITHUB_OUTPUT

      - name: Show detected Cordova project files
        run: |
          echo "Working in: $CORDOVA_DIR"
          ls -la "$CORDOVA_DIR"
          if [ -f "$CORDOVA_DIR/config.xml" ]; then
            echo "config.xml (first 200 lines):"
            sed -n '1,200p' "$CORDOVA_DIR/config.xml" || true
          fi
          echo "package.json (if present):"
          cat "$CORDOVA_DIR/package.json" || true

      - name: Install project dependencies (if any)
        if: always()
        run: |
          set -e
          if [ -f "$CORDOVA_DIR/package-lock.json" ] || [ -f "$CORDOVA_DIR/yarn.lock" ]; then
            cd "$CORDOVA_DIR"
            npm ci || npm install
          else
            echo "No package-lock/yarn.lock found, skipping npm install."
          fi

      - name: Install Cordova locally
        run: |
          set -e
          cd "$CORDOVA_DIR"
          npm install cordova --no-audit --no-fund

      - name: Add Android platform
        run: |
          set -e
          cd "$CORDOVA_DIR"
          npx cordova platform add android --no-interactive || true

      - name: Add plugins
        run: |
          set -e
          cd "$CORDOVA_DIR"
          npx cordova plugin add cordova-plugin-inappbrowser || true
          npx cordova plugin add cordova-plugin-camera || true
          npx cordova plugin add cordova-plugin-media-capture || true
          npx cordova plugin add cordova-plugin-local-notification || true
          npx cordova plugin add cordova-plugin-background-mode || true
          npx cordova plugin add cordova-plugin-splashscreen || true
          npx cordova plugin add cordova-plugin-statusbar || true
          npx cordova plugin add cordova-plugin-network-information || true
          npx cordova plugin add cordova-plugin-android-permissions || true

      - name: Build APK (debug)
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m"
        run: |
          set -e
          cd "$CORDOVA_DIR"
          npx cordova build android --no-interactive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: ${{ env.CORDOVA_DIR }}/platforms/android/app/build/outputs/apk/debug/app-debug.apk
