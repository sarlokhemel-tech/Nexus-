name: Build Nexus APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto Fix Directory & Cordova Structure
        run: |
          if [ ! -f "config.xml" ]; then
            echo "Moving project files to root..."
            find . -maxdepth 3 -name "config.xml" -exec cp -r $(dirname {})/* . \; || true
          fi
          mkdir -p www

      - name: Install Cordova
        run: npm install -g cordova

      - name: Add Android platform
        run: cordova platform add android --overwrite || true

      - name: Add plugins
        run: |
          cordova plugin add cordova-plugin-inappbrowser || true
          cordova plugin add cordova-plugin-camera || true
          cordova plugin add cordova-plugin-media-capture || true
          cordova plugin add cordova-plugin-local-notification || true
          cordova plugin add cordova-plugin-background-mode || true
          cordova plugin add cordova-plugin-splashscreen || true
          cordova plugin add cordova-plugin-statusbar || true
          cordova plugin add cordova-plugin-network-information || true
          cordova plugin add cordova-plugin-android-permissions || true

      - name: Build APK (debug)
        run: cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
