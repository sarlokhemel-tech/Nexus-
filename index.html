<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, viewport-fit=cover">
  <title>Nexus</title>
  <style>
    html,body{margin:0;height:100%;background:#0F172A;overflow:hidden;}
    #splash{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      background:#0F172A;z-index:9999;
    }
    .orbit-wrap{position:relative;width:180px;height:180px;}
    .logo{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:64px;height:64px;border-radius:50%;
      background:linear-gradient(135deg,#6366F1,#A855F7);
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-family:sans-serif;font-weight:800;font-size:30px;
      box-shadow:0 0 30px rgba(99,102,241,0.5);
    }
    .dot{
      position:absolute;width:14px;height:14px;border-radius:50%;
      background:rgba(99,102,241,0.15);
      top:50%;left:50%;
      transform-origin:0 0;
      animation:pulse 2s infinite ease-in-out;
    }
    .dot1{transform:rotate(0deg) translate(90px) translate(-7px,-7px);animation-delay:0s;}
    .dot2{transform:rotate(72deg) translate(90px) translate(-7px,-7px);animation-delay:.2s;}
    .dot3{transform:rotate(144deg) translate(90px) translate(-7px,-7px);animation-delay:.4s;}
    .dot4{transform:rotate(216deg) translate(90px) translate(-7px,-7px);animation-delay:.6s;}
    .dot5{transform:rotate(288deg) translate(90px) translate(-7px,-7px);animation-delay:.8s;}
    @keyframes pulse{
      0%,100%{background:rgba(99,102,241,0.15);box-shadow:none;}
      50%{background:#818CF8;box-shadow:0 0 12px 3px rgba(129,140,248,0.9);}
    }
    #frame{position:fixed;inset:0;border:0;width:100%;height:100%;display:none;}
  </style>
</head>
<body>
  <div id="splash">
    <div class="orbit-wrap">
      <div class="dot dot1"></div>
      <div class="dot dot2"></div>
      <div class="dot dot3"></div>
      <div class="dot dot4"></div>
      <div class="dot dot5"></div>
      <div class="logo">N</div>
    </div>
  </div>
  <iframe id="frame" allow="microphone; camera; autoplay" src="https://hemel24-massanger.hf.space/"></iframe>

  <script src="cordova.js"></script>
  <script>
    document.addEventListener('deviceready', function () {
      var frame = document.getElementById('frame');
      var splash = document.getElementById('splash');

      frame.addEventListener('load', function () {
        setTimeout(function () {
          splash.style.transition = 'opacity .4s';
          splash.style.opacity = '0';
          setTimeout(function () {
            splash.style.display = 'none';
            frame.style.display = 'block';
          }, 400);
        }, 900);
      });

      if (window.cordova && cordova.plugins && cordova.plugins.permissions) {
        var p = cordova.plugins.permissions;
        p.requestPermissions(p, [
          p.CAMERA, p.RECORD_AUDIO, p.POST_NOTIFICATIONS
        ], null, null);
      }
    }, false);
  </script>
  <script src="js/notify.js"></script>
</body>
</html>
