<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Nexus Messenger</title>
  <style>
    html,body{margin:0;height:100%;background:#0F172A;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    #splash{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#0F172A,#1E293B);z-index:9999;transition:opacity .4s ease-out;
    }
    #splash.hidden{opacity:0;pointer-events:none}
    .orbit-wrap{position:relative;width:180px;height:180px}
    .logo{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:80px;height:80px;border-radius:50%;
      background:linear-gradient(135deg,#6366F1,#A855F7);
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-weight:800;font-size:40px;
      box-shadow:0 0 40px rgba(99,102,241,0.6);animation:logoFloat 3s ease-in-out infinite;
    }
    @keyframes logoFloat{0%,100%{transform:translate(-50%,-50%)translateY(0)}50%{transform:translate(-50%,-50%)translateY(-10px)}}
    .dot{
      position:absolute;width:14px;height:14px;border-radius:50%;
      background:rgba(99,102,241,0.15);top:50%;left:50%;
      transform-origin:0 0;animation:orbit 4s linear infinite;
    }
    .dot1{animation-delay:0s}.dot2{animation-delay:.8s}.dot3{animation-delay:1.6s}.dot4{animation-delay:2.4s}.dot5{animation-delay:3.2s}
    @keyframes orbit{
      0%{transform:translate(-50%,-50%)rotate(0deg)translateX(90px)translateY(-7px);background:rgba(99,102,241,.15);box-shadow:none}
      50%{background:#818CF8;box-shadow:0 0 15px 3px rgba(129,140,248,.8)}
      100%{transform:translate(-50%,-50%)rotate(360deg)translateX(90px)translateY(-7px);background:rgba(99,102,241,.15)}
    }
    .splash-text{color:#E2E8F0;font-size:18px;font-weight:600;letter-spacing:2px;margin-top:20px;animation:fadeIn 1s .5s both}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    #frame{position:fixed;inset:0;border:0;width:100%;height:100%;display:none;background:#0F172A}
    #frame.visible{display:block}
    #error-box{display:none;position:fixed;inset:0;background:#0F172A;z-index:9998;align-items:center;justify-content:center;padding:20px}
    #error-box.show{display:flex}
    .error-content{background:linear-gradient(135deg,#1E293B,#334155);border:1px solid #475569;border-radius:16px;padding:30px;max-width:90%;text-align:center}
    .error-content h2{color:#EF4444;margin-bottom:15px;font-size:24px}
    .error-content p{color:#CBD5E1;margin-bottom:10px;line-height:1.6}
    .error-content button{margin-top:20px;padding:12px 30px;background:linear-gradient(135deg,#6366F1,#A855F7);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:transform .2s}
    .error-content button:active{transform:scale(.98)}
  </style>
</head>
<body>
  <div id="splash">
    <div class="orbit-wrap">
      <div class="dot dot1"></div>
      <div class="dot dot2"></div>
      <div class="dot dot3"></div>
      <div class="dot dot4"></div>
      <div class="dot dot5"></div>
      <div class="logo">N</div>
    </div>
    <div class="splash-text">Nexus Messenger</div>
  </div>

  <div id="error-box">
    <div class="error-content">
      <h2>⚠️ Connection Error</h2>
      <p id="error-text">Unable to load application</p>
      <button onclick="location.reload()">🔄 Retry</button>
    </div>
  </div>

  <iframe id="frame" 
    allow="microphone; camera; autoplay; geolocation" 
    src="https://hemel24-massanger.hf.space/"
    sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-pointer-lock allow-top-navigation">
  </iframe>

  <script src="cordova.js"></script>
  <script>
    const frame = document.getElementById('frame');
    const splash = document.getElementById('splash');
    const errorBox = document.getElementById('error-box');
    let frameLoaded = false;
    let loadTimeout;

    console.log('Initializing Nexus App...');

    // Handle iframe load
    frame.addEventListener('load', function () {
      frameLoaded = true;
      clearTimeout(loadTimeout);
      console.log('✓ Frame loaded successfully');
      
      setTimeout(function () {
        splash.classList.add('hidden');
        frame.classList.add('visible');
        console.log('✓ Splash hidden, app visible');
      }, 1000);
    });

    // Handle iframe error
    frame.addEventListener('error', function () {
      clearTimeout(loadTimeout);
      console.error('✗ Frame load error');
      errorBox.classList.add('show');
      document.getElementById('error-text').textContent = 'Failed to connect. Check your internet.';
    });

    // Timeout handler (20 seconds)
    loadTimeout = setTimeout(function () {
      if (!frameLoaded) {
        console.error('✗ Frame load timeout');
        errorBox.classList.add('show');
        splash.classList.add('hidden');
        document.getElementById('error-text').textContent = 'Connection timeout. Check your internet.';
      }
    }, 20000);

    // Cordova ready
    document.addEventListener('deviceready', function () {
      console.log('✓ Cordova ready');
      
      // Status bar
      if (window.StatusBar) {
        StatusBar.styleDefault();
        StatusBar.backgroundColorByHexString('#0F172A');
        console.log('✓ Status bar configured');
      }

      // Network check
      if (navigator.connection) {
        console.log('Network type:', navigator.connection.type);
      }
    }, false);
  </script>
  <script src="notify.js"></script>
</body>
</html>
